<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto QR Code Generator</title>
  <link rel="stylesheet" href="style.css" />
  <!-- QR Code Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <main class="card">
    <h2>QR Code Generator</h2>
    <p class="subtitle">Type text or select a preset button to generate</p>

    <!-- Quick-select buttons for preset QR codes -->
    <div class="preset-btn-container">
      <button type="button" class="preset-btn" data-value="IFC-PRN_123456">
        IFC-PRN
      </button>
      <button type="button" class="preset-btn" data-value="WRT-OFF_123456">
        WRT-OFF
      </button>
    </div>

    <!-- Manual input box -->
    <div class="input-group">
      <input 
        type="text" 
        id="userInput" 
        placeholder="Type here or tap a button above" 
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Responsive badge ticket container -->
    <div id="badgeCard" class="badge-card" style="display: none;">
      <div id="badgeHeader" class="badge-header"></div>
      <div id="qrcodeContainer" class="qrcode-container"></div>
      <div class="badge-footer">Scan to read value</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
