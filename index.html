<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BB QR</title>

  <!-- Title bar dark theme color -->
  <meta name="theme-color" content="#0b0f19" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b0f19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

  <main class="card">
    <!-- <h2>QR Code Generator</h2> -->

    <!-- Stage area containing Left History, Main QR Badge, and Right History -->
    <div class="badge-stage">

      <!-- Left history wrapper -->
      <div id="historyLeftWrapper" class="history-wrapper">
        <div id="historyLeft" class="history-slot" title="Click to reload"></div>
        <button id="arrowLeft" class="history-arrow" aria-label="Show more history" style="display:none;">
          <svg viewBox="0 0 10 6" width="10" height="6" fill="none">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <div id="dropdownLeft" class="history-dropdown"></div>
      </div>

      <div id="badgeCard" class="badge-card" style="display: none;">
        <div id="badgeHeader" class="badge-header"></div>
        <div id="qrcodeContainer" class="qrcode-container"></div>
        <div class="badge-footer">Scan to read value</div>
      </div>

      <!-- Right history wrapper -->
      <div id="historyRightWrapper" class="history-wrapper">
        <div id="historyRight" class="history-slot" title="Click to reload"></div>
        <button id="arrowRight" class="history-arrow" aria-label="Show more history" style="display:none;">
          <svg viewBox="0 0 10 6" width="10" height="6" fill="none">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <div id="dropdownRight" class="history-dropdown"></div>
      </div>

    </div>

    <!-- Quick preset buttons -->
    <div class="preset-btn-container">
      <button type="button" class="preset-btn" data-value="IFC-PRN_123456">
        IFC-PRN
      </button>
      <button type="button" class="preset-btn" data-value="WRT-OFF_123456">
        WRT-OFF
      </button>
      <button type="button" class="preset-btn preset-btn--pbl" id="btnPBL" data-type="pbl">
        PBL
      </button>
      <button type="button" class="preset-btn preset-btn--pbm" id="btnPBM" data-type="pbm">
        PBM
      </button>
      <button type="button" class="preset-btn preset-btn--bbnow" id="btnBBNow" data-type="bbnow"
        style="grid-column: 1 / -1;">
        BBNow
      </button>
    </div>

    <!-- Input group with clear button -->
    <div class="input-group">
      <input type="text" id="userInput" placeholder="Type here" autocomplete="off" spellcheck="false" />
      <button type="button" id="clearBtn" class="clear-btn" aria-label="Clear input" style="display: none;">
        &times;
      </button>
    </div>
  </main>

  <script src="script.js"></script>

  <!-- Register the offline service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch((error) => {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>
</body>

</html>
